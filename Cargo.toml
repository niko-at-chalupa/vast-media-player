[package]
name = "vast-media-player"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.7"
rodio = { version = "0.22", features = ["symphonia-all"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
audiotags = "0.5.0"
battery = "0.7.8"
chrono = "0.4.45"
fxhash = "0.2.1"
souvlaki = "0.8.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
slint-build = "1.7"
